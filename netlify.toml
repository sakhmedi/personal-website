# Настройки сборки живут в репозитории, а не только в панели Netlify.
# Проект лежит в корне, и base задан здесь явно: то, что написано в этом
# файле, перебивает поле Base directory в панели. Без этой строки панель
# продолжала подставлять v2 и сборка искала package.json в несуществующей
# папке. Остальные пути считаются от base, то есть от корня репозитория.

[build]
  base = "."
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Playwright нужен только локально, для npm run screens.
  # Скриншоты лежат в репозитории, поэтому на сборке
  # не качаем браузер на сотни мегабайт.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# /about и /contacts стали секциями главной.
# 301 — постоянный переезд: браузеры и поисковики запомнят новый адрес.
[[redirects]]
  from = "/about"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/contacts"
  to = "/#contacts"
  status = 301
