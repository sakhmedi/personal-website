# Настройки сборки живут в репозитории, а не только в панели Netlify.
# Netlify читает этот файл из Base directory (сейчас = v2), поэтому
# все пути ниже указаны относительно папки v2.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Playwright нужен только локально, для npm run screens.
  # Скриншоты лежат в репозитории, поэтому на сборке
  # не качаем браузер на сотни мегабайт.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
